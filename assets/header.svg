<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#151b23"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e8b84b"/>
      <stop offset="100%" stop-color="#f5d67a"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="4" fill="url(#gold)"/>

  <!-- Name -->
  <text x="64" y="128" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="54" font-weight="700" fill="#f0f6fc">Sofyan Eka Febriyanto</text>

  <!-- Gold rule -->
  <rect x="64" y="148" width="110" height="5" rx="2" fill="#e8b84b"/>

  <!-- Slogan -->
  <text x="64" y="200" font-family="'SF Mono', Consolas, Menlo, monospace" font-size="23" fill="#e8b84b">Building with Code, Thinking with Data.</text>

  <!-- Sub line -->
  <text x="64" y="240" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#8b949e">AI tools  ·  Web apps  ·  Trading systems</text>

  <!-- Candlestick chart -->
  <g opacity="0.95">
    <line x1="928" y1="210" x2="928" y2="262" stroke="#f85149" stroke-width="2"/>
    <rect x="920" y="222" width="16" height="30" fill="#f85149"/>
    <line x1="970" y1="190" x2="970" y2="250" stroke="#3fb950" stroke-width="2"/>
    <rect x="962" y="200" width="16" height="36" fill="#3fb950"/>
    <line x1="1012" y1="200" x2="1012" y2="252" stroke="#f85149" stroke-width="2"/>
    <rect x="1004" y="212" width="16" height="30" fill="#f85149"/>
    <line x1="1054" y1="168" x2="1054" y2="232" stroke="#3fb950" stroke-width="2"/>
    <rect x="1046" y="180" width="16" height="38" fill="#3fb950"/>
    <line x1="1096" y1="140" x2="1096" y2="210" stroke="#3fb950" stroke-width="2"/>
    <rect x="1088" y="154" width="16" height="42" fill="#3fb950"/>
    <line x1="1138" y1="112" x2="1138" y2="186" stroke="#3fb950" stroke-width="2"/>
    <rect x="1130" y="128" width="16" height="44" fill="#3fb950"/>
    <polyline points="928,237 970,218 1012,227 1054,199 1096,175 1138,150" fill="none" stroke="#e8b84b" stroke-width="2" opacity="0.55"/>
  </g>
</svg>
